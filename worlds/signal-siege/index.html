<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Signal Siege · Biodyssey</title>
<meta name="description" content="Place immune cells, press Run, and learn how cells signal each other.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ccircle cx='8' cy='23.5' r='2' fill='%23fff'/%3E%3Ccircle cx='15.6' cy='16.8' r='3' fill='%23fff'/%3E%3Ccircle cx='23.6' cy='9.6' r='4.2' fill='none' stroke='%236ee7b7' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../core/biodyssey.css">
<link rel="stylesheet" href="siege.css">
</head>
<body class="bd">
<main class="bd-main ss">

  <!-- ============ Boot camp (level select) ============ -->
  <section id="camp" class="bd-page">
    <header class="bd-header">
      <div class="bd-kicker">Unit 4 · Cell Communication</div>
      <h1 class="bd-h1">Signal Siege</h1>
      <p class="bd-goal">Place immune cells, press Run, and see how cells signal each other to stop an infection.</p>
      <div class="bd-actions"><button class="bd-btn lg" type="button" id="continueBtn">Start</button></div>
    </header>
    <div class="bd-card ss-goalcard"><ul class="bd-goals" id="goals"></ul></div>
    <div class="ss-section-head"><h2 class="bd-h2">Boot camp</h2><span class="bd-small" id="campStars"></span></div>
    <ol class="ss-levels" id="levels"></ol>
    <div class="bd-actions ss-camp-foot"><button class="bd-btn ghost" type="button" id="printCamp"><svg class="bd-ic" aria-hidden="true"><use href="#bdi-printer"/></svg>Print my results</button></div>
  </section>

  <!-- ============ A level ============ -->
  <section id="play" class="ss-play" hidden>
    <div class="ss-top">
      <button class="bd-btn ghost ss-back" type="button" id="backBtn"><svg class="bd-ic" aria-hidden="true"><use href="#bdi-arrow-left"/></svg>Levels</button>
      <div class="ss-title"><span class="ss-lvl-n" id="lvlN">1</span><div><b id="lvlTitle"></b><span id="lvlTopic"></span></div></div>
    </div>
    <div class="ss-layout">
      <div class="ss-boardwrap">
        <div class="ss-board" id="board" role="grid" aria-label="The board. Bacteria enter at the top and move down their lane."></div>
        <canvas class="ss-fx" id="fx" aria-hidden="true"></canvas>
        <div class="ss-tissue" aria-hidden="true">Your tissue</div>
      </div>
      <div class="ss-side">
        <div class="ss-coach"><div class="ss-chips"><span class="bd-chip" id="atpChip"></span><span class="bd-chip" id="tissueChip"></span></div><div class="ss-coach-body" id="coach" aria-live="polite"></div></div>
        <div class="ss-tray" id="tray" aria-label="Cells you can place"></div>
        <div class="ss-runrow" id="runRow">
          <button class="bd-btn lg ss-run" type="button" id="runBtn"><svg class="bd-ic" aria-hidden="true"><use href="#bdi-play"/></svg>Run</button>
          <button class="bd-btn secondary ss-speedbtn" type="button" id="speedBtn" hidden>Speed: 1×</button>
          <button class="bd-btn ghost" type="button" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="../registry.js"></script>
<script src="../../core/biodyssey.js"></script>
<script>Biodyssey.page({ world: 'signal-siege', footer: false });</script>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
